name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ESPHome
        run: pip install "esphome==2026.10.0"

      # The example placeholders fail validation on purpose; CI fills in throwaway values
      - name: Validate firmware config
        run: |
          API_KEY=$(python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())")
          AP_PASSWORD=$(python -c "import secrets;print(secrets.token_hex(8))")
          sed -e "s|^api_key: .*|api_key: \"$API_KEY\"|" \
              -e "s|^ap_password: .*|ap_password: \"$AP_PASSWORD\"|" \
              secrets.example.yaml > secrets.yaml
          esphome config ir-mate.yaml > /dev/null

      - name: Check web app syntax
        run: node --check web/app.js
