# Wi-Fi, encrypted API, OTA updates, clock and diagnostics. Credentials come from secrets.yaml.

api:
  encryption:
    key: !secret api_key
  # Runs without Home Assistant, so never reboot for lack of an API client
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - globals.set:
        id: is_wifi_connected
        value: "true"
    - light.turn_on: rgb_light
  on_disconnect:
    - globals.set:
        id: is_wifi_connected
        value: "false"
  # Fallback hotspot ("XIAO Smart IR Mate") with a setup page at 192.168.4.1
  ap:
    password: !secret ap_password

captive_portal:

# Schedules need this clock; it keeps running through Wi-Fi outages but
# must sync once after every power-up
time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s

text_sensor:
  - platform: template
    name: "Device clock"
    update_interval: 15s
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid()) {
        return {"Not synced"};
      }
      return {now.strftime("%H:%M")};

  - platform: wifi_info
    ip_address:
      name: "IP address"
    ssid:
      name: "WiFi network"
