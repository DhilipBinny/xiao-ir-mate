# Hardware base for the XIAO Smart IR Mate.
#
# Derived from Seeed Studio's stock firmware (GPL-3.0):
#   https://github.com/Seeed-Studio/xiao-esphome-projects/blob/main/projects/xiao_smart_ir_mate/xiao_smart_ir_mate.yaml
# Changes from the original:
#   - Learning publishes its progress (remote_learn_status) and refreshes the
#     learned-slot list for the web app; learn_timeout stops a forgotten learn
#   - A single tap on the touch pad toggles the AC instead of sending a learned signal
#   - Wi-Fi, API, OTA and hotspot settings moved to network.yaml with secrets

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "xiao.smart-ir-mate"
    version: "2.0"
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: sleep_timer_status
          state: "Not set"
      - text_sensor.template.publish:
          id: ir_learn_status
          state: "idle"
      - script.execute: refresh_learned_slots

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: INFO

globals:
  - id: is_wifi_connected
    type: bool
    initial_value: "false"

  - id: reset_press_time
    type: uint32_t
    initial_value: "0"

  - id: touch_timer
    type: unsigned long
    restore_value: no
    initial_value: "0"

  - id: is_learning_mode
    type: bool
    initial_value: "false"

  # Slot chosen in signal_select (0-9)
  - id: signal_select_index
    type: int
    restore_value: no
    initial_value: "0"

  # Raw signal of the selected slot, loaded from NVS
  - id: send_data_vector
    type: std::vector<long int>
    restore_value: no

  # Ignore captures shorter than this (noise)
  - id: filter_size
    type: int
    initial_value: "10"

external_components:
  - source:
      type: git
      url: https://github.com/Seeed-Studio/xiao-esphome-projects
      ref: ${seeed_components_ref}
    components: [Flash_comp]

# Stores learned raw IR signals in NVS
Flash_comp:
  id: signal_nvs

remote_transmitter:
  id: my_transmitter
  pin: GPIO3
  non_blocking: true
  carrier_duty_percent: 50%

remote_receiver:
  - id: rcvr
    pin:
      number: GPIO4
      inverted: true
    # A gap longer than this starts a new signal segment
    idle: 65500us
    clock_resolution: "500000"
    # Signals are stored raw (not decoded) so any protocol can be replayed
    on_raw:
      - switch.turn_off: vibration_switch
      - lambda: |-
          if (id(is_learning_mode) && x.size() > id(filter_size)) {
            ESP_LOGI("ir", "Saved signal index: %d", id(signal_select_index));
            id(signal_nvs).save_to_nvs(id(signal_select_index), x);
            id(send_data_vector) = id(signal_nvs).load_from_nvs<long int>(id(signal_select_index));
            id(is_learning_mode) = false;
            id(is_learned_signal_script).execute(true);
            id(learn_timeout).stop();
            id(ir_learn_status).publish_state("saved");
            id(refresh_learned_slots).execute();
          }

button:
  # Arms learning: the next IR signal received is saved to the selected slot
  - platform: template
    id: learn
    name: "Learn"
    on_press:
      - switch.turn_on: vibration_switch
      - lambda: |-
          id(is_learning_mode) = true;
          ESP_LOGI("ir", "Learning mode activated");
      - text_sensor.template.publish:
          id: ir_learn_status
          state: "learning"
      - script.execute: learn_timeout

  # Sends the signal stored in the selected slot
  - platform: template
    id: transmit
    name: "Send"
    on_press:
      - lambda: |-
          if (!id(send_data_vector).empty()) {
            id(send_raw).execute();
            ESP_LOGI("ir", "Sending signal index: %d (%d pulses)", id(signal_select_index), id(send_data_vector).size());
          } else {
            ESP_LOGI("ir", "Signal index %d not learned", id(signal_select_index));
          }

select:
  - platform: template
    name: signal_select
    id: signal_select
    options: ["Signal0", "Signal1", "Signal2", "Signal3", "Signal4", "Signal5", "Signal6", "Signal7", "Signal8", "Signal9"]
    initial_option: "Signal0"
    optimistic: true
    on_value:
      - lambda: |-
          id(signal_select_index) = i;
          id(send_data_vector) = id(signal_nvs).load_from_nvs<long int>(i);
          id(is_learned_signal_script).execute(!id(send_data_vector).empty());

switch:
  - platform: output
    id: vibration_switch
    name: "Vibration device"
    output: vibration_output

  - platform: factory_reset
    id: factory_switch
    name: "Restart with Factory Default Settings"

  # On when the selected slot holds a signal
  - platform: template
    id: is_learned_signal_switch
    name: "Is Learned Signal?"
    optimistic: true

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    name: "WIFI RGB Light"
    id: rgb_light
    rmt_symbols: 48

binary_sensor:
  - platform: gpio
    id: touch_pad
    pin:
      number: GPIO5
      mode: INPUT_PULLDOWN
    on_state:
      then:
        - lambda: |-
            id(vibe).execute(100);
            id(touch_timer) = millis();
            if (id(check_touch_delay).is_running()) {
              id(check_touch_delay).stop();
            }
            id(check_touch_delay).execute();

  # Short press restarts; hold 5 s to clear learned signals and factory reset
  - platform: gpio
    id: reset_button
    pin:
      number: GPIO9
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
    filters:
      - invert
    on_press:
      then:
        - lambda: id(reset_press_time) = millis();
    on_release:
      then:
        - lambda: |-
            uint32_t press_duration = millis() - id(reset_press_time);
            if (press_duration < 5000) {
              id(vibe).execute(100);
              ESP_LOGI("ir", "Restart device");
              ESP.restart();
            } else {
              for (int i = 0; i < 10; i++) {
                id(signal_nvs).clear_signal_by_index(i);
              }
              ESP_LOGI("ir", "Restart with factory default settings");
              id(vibe).execute(500);
              id(factory_switch).turn_on();
            }

output:
  - platform: gpio
    id: vibration_output
    pin: GPIO6

script:
  - id: vibe
    parameters:
      delay_ms: int
    then:
      - switch.turn_on: vibration_switch
      - delay: !lambda return delay_ms;
      - switch.turn_off: vibration_switch

  # Single tap on the touch pad toggles the AC between off and cool
  - id: check_touch_delay
    then:
      - delay: 300ms
      - lambda: |-
          if (millis() - id(touch_timer) >= 300) {
            ESP_LOGI("touch", "Single tap: toggle AC");
            auto call = id(ac).make_call();
            call.set_mode(id(ac).mode == climate::CLIMATE_MODE_OFF ? climate::CLIMATE_MODE_COOL : climate::CLIMATE_MODE_OFF);
            call.perform();
          }

  - id: send_raw
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda return id(send_data_vector);
          carrier_frequency: 38000Hz
          repeat: 1

  - id: is_learned_signal_script
    parameters:
      is_learned_signal: bool
    then:
      - lambda: |-
          if (is_learned_signal) {
            id(is_learned_signal_switch).turn_on();
          } else {
            id(is_learned_signal_switch).turn_off();
          }

  # Learning vibrates until a signal arrives; stop it if none does
  - id: learn_timeout
    mode: restart
    then:
      - delay: 30s
      - lambda: id(is_learning_mode) = false;
      - switch.turn_off: vibration_switch
      - text_sensor.template.publish:
          id: ir_learn_status
          state: "timeout"

# Blink the LED white while Wi-Fi is disconnected
interval:
  - id: blink_rgb
    interval: 500ms
    then:
      - lambda: |-
          if (!id(is_wifi_connected)) {
            static bool led_on = false;
            led_on = !led_on;
            auto call = led_on ? id(rgb_light).turn_on() : id(rgb_light).turn_off();
            if (led_on) call.set_rgb(1.0, 1.0, 1.0);
            call.set_transition_length(0);
            call.perform();
          }
