# Copy to secrets.yaml and replace every value. secrets.yaml is gitignored.

# 2.4 GHz Wi-Fi (the ESP32-C3 has no 5 GHz radio)
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# Fallback hotspot password, at least 8 characters
ap_password: "CHANGE_ME_8_CHARS"

# Web app login password (user is admin)
web_password: "CHANGE_ME"

# API encryption key: 32 random bytes, base64. Generate one with:
#   python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
# The key below is a public example so this file validates; never flash it.
api_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="

# OTA update password. Generate one with:
#   python3 -c "import secrets;print(secrets.token_hex(16))"
ota_password: "CHANGE_ME"
